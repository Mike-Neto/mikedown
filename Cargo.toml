[package]
name = "mikedown"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "A plain-text document language and deterministic formatter"

[dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
nom = "=8.0.0"
thiserror = "=2.0.21"
unicode-width = "=0.2.2"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# standard preferences
blanket_clippy_restriction_lints = "allow"

# Keep restriction checks, but permit idiomatic Rust and validated parser
# operations. These style rules compete with readability or each other here.
arbitrary_source_item_ordering = "allow"
arithmetic_side_effects = "allow"
default_numeric_fallback = "allow"
implicit_return = "allow"
indexing_slicing = "allow"
min_ident_chars = "allow"
missing_docs_in_private_items = "allow"
non_ascii_literal = "allow"
pattern_type_mismatch = "allow"
pub_with_shorthand = "allow"
question_mark_used = "allow"
redundant_pub_crate = "allow"
shadow_reuse = "allow"
shadow_unrelated = "allow"
single_call_fn = "allow"
string_slice = "allow"
unused_trait_names = "allow"
